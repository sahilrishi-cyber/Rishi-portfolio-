<style>
[data-theme="dark"]{--cyan:#00f5ff;--pink:#ff006e;--purple:#bf00ff;--green:#00ff88;--yellow:#fff200;--bg:#020408;--bg2:#060d12;--surface:#0a1520;--border:#0d2535;--text:#8ab4cc;--white:#e0f4ff;}
[data-theme="light"]{--cyan:#0077aa;--pink:#cc0055;--purple:#7700bb;--green:#007733;--yellow:#aa8800;--bg:#f5f9ff;--bg2:#eaf3ff;--surface:#ffffff;--border:#c0d8ee;--text:#334455;--white:#111827;}
[data-theme="light"] .hero-name,[data-theme="light"] .sec-title,[data-theme="light"] .srv-title,[data-theme="light"] .p-title,[data-theme="light"] .about-txt h2,[data-theme="light"] .price-name,[data-theme="light"] .blog-title,[data-theme="light"] .faq-q,[data-theme="light"] .t-name,[data-theme="light"] .cont-info h2{color:#111827!important;}
[data-theme="light"] .hero-desc,[data-theme="light"] .srv-desc,[data-theme="light"] .a-bio,[data-theme="light"] .t-text,[data-theme="light"] .blog-desc,[data-theme="light"] .faq-a,[data-theme="light"] .price-list li,[data-theme="light"] .cont-info p{color:#445566!important;}
[data-theme="light"] nav{background:linear-gradient(to bottom,rgba(245,249,255,.98),transparent);}
[data-theme="light"] body::before{background:none;}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--text);font-family:'Rajdhani',sans-serif;overflow-x:hidden;cursor:none;transition:background .4s,color .4s;}

/* LOADER */
#loader{position:fixed;inset:0;background:var(--bg);z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .8s ease;}
#loader.hide{opacity:0;pointer-events:none;}
.loader-logo{font-family:'Orbitron',monospace;font-size:36px;font-weight:900;color:var(--cyan);letter-spacing:6px;text-shadow:0 0 30px var(--cyan);margin-bottom:8px;animation:logoPulse 1.5s ease-in-out infinite;}
.loader-logo span{color:var(--pink);}
.loader-sub{font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:4px;color:var(--text);text-transform:uppercase;margin-bottom:40px;}
.loader-bar{width:200px;height:2px;background:rgba(0,245,255,.1);position:relative;overflow:hidden;}
.loader-fill{position:absolute;top:0;left:0;height:100%;background:linear-gradient(90deg,var(--cyan),var(--pink));width:0%;box-shadow:0 0 10px var(--cyan);}
.loader-pct{font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--cyan);margin-top:12px;letter-spacing:2px;}
@keyframes logoPulse{0%,100%{text-shadow:0 0 30px var(--cyan)}50%{text-shadow:0 0 60px var(--cyan),0 0 100px rgba(0,245,255,.4)}}

#scrollBar{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--cyan),var(--pink));width:0%;z-index:9998;box-shadow:0 0 8px var(--cyan);}
#backTop{position:fixed;bottom:90px;right:24px;width:44px;height:44px;background:rgba(0,245,255,.1);border:1px solid rgba(0,245,255,.3);color:var(--cyan);font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:900;opacity:0;transform:translateY(20px);transition:all .3s;backdrop-filter:blur(8px);}
#backTop.show{opacity:1;transform:translateY(0);}
#backTop:hover{background:rgba(0,245,255,.2);box-shadow:0 0 20px rgba(0,245,255,.3);}
#themeToggle{position:fixed;bottom:30px;right:24px;width:44px;height:44px;background:rgba(0,245,255,.1);border:1px solid rgba(0,245,255,.3);color:var(--cyan);font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:900;transition:all .3s;backdrop-filter:blur(8px);}
#themeToggle:hover{background:rgba(0,245,255,.2);}
#waChat{position:fixed;bottom:30px;left:24px;display:flex;align-items:center;gap:10px;background:#25D366;border:none;border-radius:50px;padding:12px 20px;color:#fff;font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:1px;cursor:pointer;z-index:900;box-shadow:0 4px 20px rgba(37,211,102,.4);transition:all .3s;text-decoration:none;}
#waChat:hover{transform:scale(1.05);box-shadow:0 6px 30px rgba(37,211,102,.6);}
#cur{position:fixed;width:10px;height:10px;background:var(--cyan);border-radius:50%;pointer-events:none;z-index:99999;transform:translate(-50%,-50%);box-shadow:0 0 15px var(--cyan);mix-blend-mode:screen;transition:width .2s,height .2s,background .2s;}
#cur2{position:fixed;width:32px;height:32px;border:1px solid rgba(0,245,255,0.35);border-radius:50%;pointer-events:none;z-index:99998;transform:translate(-50%,-50%);}
.trail{position:fixed;width:6px;height:6px;border-radius:50%;pointer-events:none;z-index:99990;transform:translate(-50%,-50%);mix-blend-mode:screen;}
body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.025) 2px,rgba(0,0,0,0.025) 4px);pointer-events:none;z-index:9999;}
#scene3d{position:fixed;inset:0;z-index:0;pointer-events:none;}
#particles{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
.particle{position:absolute;border-radius:50%;pointer-events:none;animation:particleFloat linear infinite;}
@keyframes particleFloat{0%{transform:translateY(100vh) scale(0);opacity:0;}10%{opacity:1;}90%{opacity:.5;}100%{transform:translateY(-100px) scale(1);opacity:0;}}

.vid-modal{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:10000;display:none;align-items:center;justify-content:center;padding:20px;}
.vid-modal.show{display:flex;}
.vid-wrap{position:relative;width:100%;max-width:800px;aspect-ratio:16/9;}
.vid-wrap iframe{width:100%;height:100%;border:none;}
.vid-close{position:absolute;top:-44px;right:0;background:none;border:none;color:#fff;font-size:28px;cursor:pointer;font-family:'Orbitron',monospace;}

nav{position:fixed;top:0;left:0;right:0;z-index:1000;padding:18px 48px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(to bottom,rgba(2,4,8,.95),transparent);backdrop-filter:blur(12px);}
.logo{font-family:'Orbitron',monospace;font-size:17px;font-weight:900;color:var(--cyan);letter-spacing:3px;text-shadow:0 0 20px var(--cyan);text-decoration:none;}
.logo span{color:var(--pink);}
.nav-links{display:flex;gap:28px;list-style:none;}
.nav-links a{font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:2px;color:var(--text);text-decoration:none;text-transform:uppercase;transition:color .3s;position:relative;}
.nav-links a::after{content:'';position:absolute;bottom:-4px;left:0;width:0;height:1px;background:var(--cyan);transition:width .3s;}
.nav-links a:hover{color:var(--cyan);}
.nav-links a:hover::after{width:100%;}
.nav-hire{font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:2px;padding:10px 22px;border:1px solid var(--pink);color:var(--pink);text-decoration:none;text-transform:uppercase;transition:all .3s;position:relative;overflow:hidden;}
.nav-hire::before{content:'';position:absolute;inset:0;background:var(--pink);transform:scaleX(0);transform-origin:left;transition:transform .3s;z-index:-1;}
.nav-hire:hover{color:#000;}
.nav-hire:hover::before{transform:scaleX(1);}
#hero{min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;z-index:1;padding:100px 48px 60px;overflow:hidden;}
.hero-wrap{text-align:center;position:relative;z-index:2;}
.hero-tag{font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:6px;color:var(--pink);text-transform:uppercase;margin-bottom:24px;opacity:0;animation:fadeUp .8s .2s forwards;}
.hero-name{font-family:'Orbitron',monospace;font-size:clamp(42px,7.5vw,100px);font-weight:900;line-height:1;color:var(--white);letter-spacing:4px;text-transform:uppercase;margin-bottom:14px;opacity:0;animation:fadeUp .8s .4s forwards;}
.glitch{position:relative;display:inline-block;}
.glitch::before,.glitch::after{content:attr(data-text);position:absolute;inset:0;font-family:'Orbitron',monospace;font-weight:900;}
.glitch::before{color:var(--cyan);animation:g1 4s infinite;clip-path:polygon(0 25%,100% 25%,100% 45%,0 45%);transform:translate(-2px,0);}
.glitch::after{color:var(--pink);animation:g2 4s infinite;clip-path:polygon(0 65%,100% 65%,100% 80%,0 80%);transform:translate(2px,0);}
@keyframes g1{0%,88%,100%{opacity:0}89%{opacity:.9;transform:translate(-4px,-1px)}91%{opacity:0}93%{opacity:.7}}
@keyframes g2{0%,82%,100%{opacity:0}83%{opacity:.8;transform:translate(4px,1px)}85%{opacity:0}87%{opacity:.6}}
.hero-sub{font-family:'Orbitron',monospace;font-size:clamp(12px,1.8vw,20px);font-weight:400;letter-spacing:8px;color:var(--cyan);text-transform:uppercase;margin-bottom:28px;opacity:0;animation:fadeUp .8s .6s forwards;text-shadow:0 0 15px var(--cyan);}
.hero-desc{font-size:16px;color:var(--text);max-width:500px;margin:0 auto 40px;line-height:1.9;opacity:0;animation:fadeUp .8s .8s forwards;}
.hero-btns{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;opacity:0;animation:fadeUp .8s 1s forwards;}
.btn-p{font-family:'Share Tech Mono',monospace;font-size:12px;letter-spacing:3px;padding:14px 32px;background:var(--cyan);color:#000;text-decoration:none;text-transform:uppercase;font-weight:700;transition:all .3s;clip-path:polygon(8px 0%,100% 0%,calc(100% - 8px) 100%,0% 100%);}
.btn-p:hover{background:#fff;box-shadow:0 0 30px var(--cyan);transform:translateY(-2px);}
.btn-s{font-family:'Share Tech Mono',monospace;font-size:12px;letter-spacing:3px;padding:14px 32px;border:1px solid rgba(0,245,255,.3);color:var(--cyan);text-decoration:none;text-transform:uppercase;transition:all .3s;clip-path:polygon(8px 0%,100% 0%,calc(100% - 8px) 100%,0% 100%);}
.btn-s:hover{border-color:var(--cyan);background:rgba(0,245,255,.06);box-shadow:0 0 20px rgba(0,245,255,.2);transform:translateY(-2px);}
.scroll-ind{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;opacity:0;animation:fadeUp .8s 1.4s forwards;}
.scroll-ind span{font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:4px;color:var(--text);}
.scroll-ln{width:1px;height:48px;background:linear-gradient(to bottom,var(--cyan),transparent);animation:sPulse 2s infinite;}
@keyframes sPulse{0%,100%{opacity:1}50%{opacity:.3}}
.float-el{position:absolute;pointer-events:none;z-index:1;}
.ticker-wrap{position:relative;z-index:1;background:#000;border-top:1px solid rgba(0,245,255,.12);border-bottom:1px solid rgba(0,245,255,.12);overflow:hidden;padding:11px 0;}
.ticker{display:flex;animation:tick 22s linear infinite;width:max-content;white-space:nowrap;}
.t-item{font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:4px;color:var(--text);padding:0 36px;text-transform:uppercase;}
.t-item span{color:var(--cyan);margin-right:6px;}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.stats{position:relative;z-index:1;background:var(--surface);border-top:1px solid rgba(0,245,255,.08);border-bottom:1px solid rgba(0,245,255,.08);padding:28px 48px;display:flex;justify-content:center;gap:80px;flex-wrap:wrap;}
.stat-n{font-family:'Orbitron',monospace;font-size:34px;font-weight:900;color:var(--cyan);text-shadow:0 0 20px var(--cyan);line-height:1;}
.stat-n em{color:var(--pink);font-style:normal;}
.stat-l{font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:3px;color:var(--text);margin-top:4px;text-transform:uppercase;}
.sec{position:relative;z-index:1;padding:100px 48px;max-width:1200px;margin:0 auto;}
.sec-hdr{text-align:center;margin-bottom:60px;}
.sec-tag{font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:5px;color:var(--pink);text-transform:uppercase;margin-bottom:12px;display:block;}
.sec-title{font-family:'Orbitron',monospace;font-size:clamp(26px,3.5vw,44px);font-weight:900;color:var(--white);letter-spacing:2px;text-transform:uppercase;display:inline-block;}
.sec-title::after{content:'';display:block;width:60px;height:2px;background:linear-gradient(90deg,var(--cyan),var(--pink));margin:14px auto 0;box-shadow:0 0 10px var(--cyan);}
.port-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;}
.port-item{position:relative;aspect-ratio:16/9;overflow:hidden;background:var(--surface);cursor:pointer;}
.port-item.lg{grid-column:span 2;}
.port-thumb{width:100%;height:100%;display:flex;align-items:center;justify-content:center;transition:transform .6s;position:relative;}
.port-item:hover .port-thumb{transform:scale(1.06);}
.port-overlay{position:absolute;inset:0;background:rgba(2,4,8,.87);display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;transition:opacity .4s;backdrop-filter:blur(4px);padding:20px;text-align:center;}
.port-item:hover .port-overlay{opacity:1;}
.p-tag{font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:3px;padding:4px 10px;border:1px solid;margin-bottom:12px;text-transform:uppercase;}
.p-title{font-family:'Orbitron',monospace;font-size:15px;font-weight:700;color:var(--white);letter-spacing:1px;margin-bottom:8px;}
.p-desc{font-size:12px;color:var(--text);line-height:1.6;}
.play-ic{width:44px;height:44px;border:2px solid var(--cyan);border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:14px;transition:all .3s;}
.play-ic::after{content:'';border-left:13px solid var(--cyan);border-top:8px solid transparent;border-bottom:8px solid transparent;margin-left:4px;}
.port-item:hover .play-ic{background:rgba(0,245,255,.1);box-shadow:0 0 20px var(--cyan);}
.p-lbl{position:absolute;bottom:0;left:0;right:0;padding:10px 14px;background:linear-gradient(to top,rgba(2,4,8,.9),transparent);font-size:13px;font-weight:600;color:var(--white);letter-spacing:1px;transition:opacity .4s;}
.port-item:hover .p-lbl{opacity:0;}
.srv-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:rgba(0,245,255,.04);border:1px solid rgba(0,245,255,.07);}
.srv-card{background:var(--bg2);padding:34px 26px;position:relative;overflow:hidden;transition:background .3s;}
.srv-card::before{content:'';position:absolute;top:0;left:0;width:100%;height:2px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);transform:scaleX(0);transition:transform .4s;}
.srv-card:hover{background:var(--surface);}
.srv-card:hover::before{transform:scaleX(1);}
.srv-n{position:absolute;top:14px;right:18px;font-family:'Orbitron',monospace;font-size:46px;font-weight:900;color:rgba(0,245,255,.04);line-height:1;}
.srv-icon{font-size:30px;margin-bottom:14px;display:block;}
.srv-title{font-family:'Orbitron',monospace;font-size:13px;font-weight:700;color:var(--white);letter-spacing:1px;margin-bottom:9px;text-transform:uppercase;}
.srv-desc{font-size:13px;color:var(--text);line-height:1.7;}
.srv-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:14px;}
.stag{font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:1px;padding:3px 7px;background:rgba(0,245,255,.05);border:1px solid rgba(0,245,255,.13);color:var(--cyan);text-transform:uppercase;}
/* LOGOS */
.logos-wrap{overflow:hidden;padding:20px 0;position:relative;}
.logos-wrap::before,.logos-wrap::after{content:'';position:absolute;top:0;width:100px;height:100%;z-index:2;}
.logos-wrap::before{left:0;background:linear-gradient(to right,var(--bg2),transparent);}
.logos-wrap::after{right:0;background:linear-gradient(to left,var(--bg2),transparent);}
.logos-track{display:flex;gap:40px;animation:logoScroll 20s linear infinite;width:max-content;}
.logo-item{background:var(--surface);border:1px solid var(--border);padding:16px 28px;font-family:'Orbitron',monospace;font-size:12px;font-weight:700;color:var(--text);letter-spacing:2px;white-space:nowrap;transition:all .3s;}
.logo-item:hover{border-color:var(--cyan);color:var(--cyan);}
@keyframes logoScroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.about-grid{display:grid;grid-template-columns:1fr 1.3fr;gap:80px;align-items:center;}
.about-vis{position:relative;aspect-ratio:3/4;}
.a-frame{position:absolute;inset:0;border:1px solid rgba(0,245,255,.18);background:var(--surface);overflow:hidden;display:flex;align-items:center;justify-content:center;}
.a-frame::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(0,245,255,.04),rgba(255,0,110,.04));}
.cn{position:absolute;width:18px;height:18px;}
.cn-tl{top:-1px;left:-1px;border-top:2px solid var(--cyan);border-left:2px solid var(--cyan);}
.cn-tr{top:-1px;right:-1px;border-top:2px solid var(--cyan);border-right:2px solid var(--cyan);}
.cn-bl{bottom:-1px;left:-1px;border-bottom:2px solid var(--cyan);border-left:2px solid var(--cyan);}
.cn-br{bottom:-1px;right:-1px;border-bottom:2px solid var(--cyan);border-right:2px solid var(--cyan);}
.a-accent{position:absolute;bottom:-18px;right:-18px;width:110px;height:110px;border:1px solid rgba(255,0,110,.28);background:rgba(255,0,110,.03);}
.about-txt h2{font-family:'Orbitron',monospace;font-size:34px;font-weight:900;color:var(--white);text-transform:uppercase;letter-spacing:2px;margin-bottom:6px;}
.about-txt h2 em{color:var(--cyan);font-style:normal;text-shadow:0 0 20px var(--cyan);}
.a-sub{font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:3px;color:var(--pink);text-transform:uppercase;margin-bottom:22px;}
.a-bio{font-size:15px;color:var(--text);line-height:1.85;margin-bottom:28px;}
.a-bio strong{color:var(--white);}
.skill-list{display:flex;flex-direction:column;gap:12px;}
.sk-row{display:flex;flex-direction:column;gap:5px;}
.sk-info{display:flex;justify-content:space-between;}
.sk-nm{font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:2px;color:var(--white);text-transform:uppercase;}
.sk-pc{font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--cyan);}
.sk-bar{height:2px;background:rgba(255,255,255,.05);position:relative;overflow:hidden;}
.sk-fill{position:absolute;top:0;left:0;height:100%;background:linear-gradient(90deg,var(--cyan),var(--pink));box-shadow:0 0 8px var(--cyan);}
.test-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.test-card{background:var(--surface);border:1px solid var(--border);padding:26px 22px;position:relative;overflow:hidden;transition:border-color .3s,transform .3s;}
.test-card:hover{border-color:rgba(0,245,255,.28);transform:translateY(-4px);}
.test-card::before{content:'"';position:absolute;top:-10px;right:18px;font-family:'Orbitron',monospace;font-size:90px;font-weight:900;color:rgba(0,245,255,.04);line-height:1;}
.t-stars{color:var(--yellow);font-size:13px;letter-spacing:3px;margin-bottom:12px;}
.t-text{font-size:13px;color:var(--text);line-height:1.8;margin-bottom:18px;font-style:italic;}
.t-author{display:flex;align-items:center;gap:11px;}
.t-av{width:34px;height:34px;background:linear-gradient(135deg,var(--cyan),var(--pink));border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Orbitron',monospace;font-size:11px;font-weight:900;col
